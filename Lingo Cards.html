const NAV=[["home","Home","⌂"],["learn","Learn","❖"],["vocab","My Vocabulary","☰"],["review","Review","↻"],["stats","Statistics","◔"],["settings","Settings","⚙"]];
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.getElementById("toasts").appendChild(t);setTimeout(()=>t.remove(),2600)}
function confetti(n=60){const c=["#B9A7E8","#B8CDBA","#F2D58A","#e9b9c4"];for(let i=0;i<n;i++){const e=document.createElement("div");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%4]};--dx:${Math.random()*160-80}px;animation-delay:${Math.random()*.5}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function speak(t,l){if(!S.snd)return toast("Sound is off in Settings");if(!window.speechSynthesis)return toast("Speech isn’t supported here");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LN[l].v;u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(l==="e"?"en":"tr"));if(v)u.voice=v;speechSynthesis.speak(u)}
function go(v,a=true){view=v;if(v!=="learn")ses=null;render(a)}
function startS(l,t){const list=filt(l,t);if(!list.length){toast("No words here yet");return}
const w={learning:3,learned:.5,new:1.5};const q=list.map(x=>({id:x.id,k:(t==="review"?(x.st==="learning"?3:2):isRev(x)?2:w[x.st])+Math.random()*1.4})).sort((a,b)=>b.k-a.k).slice(0,25).map(x=>x.id);
ses={l,t,q,n:q.length,fl:false};view="learn";render(true)}
const left=()=>new Set(ses.q).size;
function ans(known){const w=gid(ses.q[0]);if(!ses.fl)return;const now=Date.now();
if(known){w.st="learned";w.learnedOn=day();w.due=now+INT[Math.min(w.box,4)]*DAY;w.box=Math.min(w.box+1,5);S.xp+=10;ses.q=ses.q.filter(i=>i!==w.id)}
else{w.st="learning";w.box=0;w.due=now;S.xp+=4;const rest=ses.q.slice(1).filter(i=>i!==w.id);rest.splice(Math.min(4,rest.length),0,w.id);ses.q=rest}
const d=day(),y=day(new Date(now-DAY));if(S.last!==d){S.streak=S.last===y?S.streak+1:1;S.last=d}
S.log[d]=(S.log[d]||0)+1;if(S.log[d]===S.goal){toast("Daily goal complete! 🎉");confetti(50)}
save();const sc=document.querySelector(".scene");if(sc){sc.classList.add("pop");toast(known?"Nice — +10 XP ✓":"We’ll bring it back soon ↻")}
ses.fl=false;setTimeout(()=>render(false),known?380:300)}
const streak=()=>S.last===day()||S.last===day(new Date(Date.now()-DAY))?S.streak:0,today=()=>S.log[day()]||0;
const nA=(n,s="")=>`<span data-n="${n}" data-s="${s}">${n}${s}</span>`;
function stat(l){const a=by(l);return{t:a.length,k:a.filter(w=>w.st==="learned").length,r:a.filter(isRev).length}}
function langCards(m){return`<div class="grid2">`+["e","t"].map(l=>{const s=stat(l),p=s.t?Math.round(s.k/s.t*100):0;return`<div class="card lang ${l==="e"?"en":"tr"}" onclick="pick('${l}','${m}')"><div style="font-size:30px">${LN[l].f}</div><h2>${LN[l].t}</h2><div class="mu">${LN[l].n} · ${p}% learned</div>
<div class="stats3"><div><b>${nA(s.t)}</b><span>Total words</span></div><div><b>${nA(s.k)}</b><span>Learned</span></div><div><b>${nA(s.r)}</b><span>To review</span></div></div>
<div class="bar"><i style="width:${p}%"></i></div><button class="btn" style="margin-top:18px">${m==="review"?"Start Review":"Start Learning"}</button></div>`}).join("")+`</div>`}
function pick(l,m){if(m==="review"&&!filt(l,"review").length)return toast("Nothing to review yet — learn some words first");startS(l,m==="review"?"review":"all")}
function home(){const g=S.goal,t=today(),p=Math.min(100,Math.round(t/g*100)),lt=S.words.filter(w=>w.learnedOn===day()).length;
return`<h1>A little progress every day.</h1><p class="mu serif" style="font-size:19px;margin:6px 0 0;font-style:italic">Learn new words, one card at a time.</p>
<div class="mini"><div class="card"><b>🔥 ${nA(streak())}</b><span>Day streak</span></div><div class="card"><b>${nA(t)} / ${g}</b><span>Today’s goal</span></div><div class="card"><b>${nA(lt)}</b><span>Learned today</span></div><div class="card"><b>${nA(S.xp)}</b><span>XP</span><div class="bar" style="margin-top:8px"><i style="width:${p}%;background:var(--but)"></i></div></div></div>
<p class="mu" style="margin:-8px 0 22px">${t>=g?"Goal reached — lovely work. ":""}${MSG[S.n%5]}</p>${langCards("learn")}`}
function learn(){if(!ses)return`<h1>Choose a language</h1><p class="mu">Pick a deck to start a session.</p><div style="height:22px"></div>`+langCards("learn");
const l=ses.l,q=ses.q;
const head=`<div class="top"><button class="btn g" onclick="ses=null;go('home')">← Back</button><h2>${LN[l].f} ${LN[l].n}</h2><span class="chip">${TABS.find(x=>x[0]===ses.t)[1]}</span><span class="mu" style="margin-left:auto">${ses.n-left()} / ${ses.n} done</span></div>
<div class="bar" style="margin-top:16px"><i style="width:${Math.round((ses.n-left())/ses.n*100)}%"></i></div>
<div class="tabs">${TABS.map(([k,n])=>`<button class="tab ${k===ses.t?"on":""}" onclick="startS('${l}','${k}')">${n}<em>${filt(l,k).length}</em></button>`).join("")}</div>`;
if(!q.length){return head+`<div class="card" style="text-align:center;padding:48px 20px;max-width:560px;margin:26px auto"><div style="font-size:42px">🌿</div><h2 style="margin:10px 0">Session complete</h2><p class="mu">${MSG[S.n++%5]}</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn l" onclick="startS('${l}','${ses.t}')">Shuffle again</button><button class="btn g" onclick="ses=null;go('home')">Home</button></div></div>`}
const w=gid(q[0]);
return head+`<div class="scene" onclick="flip()"><div class="c3 ${ses.fl?"flip":""}" id="c3"><div class="face"><span class="lab">${LN[l].n}${w.cat?" · "+CATS[w.cat]:""}</span><div class="big">${esc(w.w)}</div>${w.ph?`<div class="mu">/${esc(w.ph)}/</div>`:""}<button class="snd" onclick="event.stopPropagation();speak(gid('${w.id}').w,'${l}')" aria-label="Play">🔊</button><span class="hint">Click the card to reveal the translation</span></div>
<div class="face back"><span class="lab">Russian</span><div class="big">${esc(w.ru)}</div><div class="ex" style="margin-top:10px">${esc(w.ex)}</div><div class="mu" style="font-size:13px">${esc(w.xr)}</div><button class="snd" onclick="event.stopPropagation();speak(gid('${w.id}').ex||gid('${w.id}').w,'${l}')" aria-label="Play">🔊</button></div></div></div>
<div class="acts"><button class="btn s" id="bk" onclick="ans(true)" ${ses.fl?"":"disabled"}>I know this ✓</button><button class="btn o" id="bp" onclick="ans(false)" ${ses.fl?"":"disabled"}>Need to practice ↻</button></div>
<div class="kbd"><kbd>Space</kbd> flip · <kbd>→</kbd> I know this · <kbd>←</kbd> Need to practice</div>`}
function flip(){if(!ses||!ses.q.length)return;ses.fl=!ses.fl;document.getElementById("c3").classList.toggle("flip",ses.fl);if(ses.fl){bk.disabled=bp.disabled=false}}
function vocab(){return`<div class="row" style="justify-content:space-between"><h1>My Vocabulary</h1><button class="btn l" onclick="edit()">+ Add word</button></div>
<div class="ctl"><input id="fq" placeholder="Search words or translations…" value="${esc(filters.q)}" oninput="filters.q=this.value;vlist()"><select onchange="filters.l=this.value;vlist()"><option value="">Both languages</option><option value="e" ${filters.l==="e"?"selected":""}>English</option><option value="t" ${filters.l==="t"?"selected":""}>Turkish</option></select>
<select onchange="filters.s=this.value;vlist()"><option value="">Any status</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${filters.s===k?"selected":""}>${v}</option>`).join("")}</select>
<select onchange="filters.c=this.value;vlist()"><option value="">All categories</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${filters.c===k?"selected":""}>${v}</option>`).join("")}</select></div><div id="vl"></div>`}
function vlist(){const q=filters.q.toLowerCase(),a=S.words.filter(w=>(!filters.l||w.l===filters.l)&&(!filters.s||w.st===filters.s)&&(!filters.c||w.cat===filters.c)&&(!q||(w.w+w.ru).toLowerCase().includes(q)));
document.getElementById("vl").innerHTML=`<p class="mu">${a.length} word${a.length===1?"":"s"}</p>`+(a.slice(0,150).map(w=>`<div class="card item"><div><b style="font-size:17px">${LN[w.l].f} ${esc(w.w)}</b>${w.cat?`<span class="tag">${CATS[w.cat]||esc(w.cat)}</span>`:""}${w.ph?`<div class="mu" style="font-size:12px">/${esc(w.ph)}/</div>`:""}</div><div>${esc(w.ru)}</div>
<div class="row" style="gap:4px;justify-content:flex-end"><select onchange="setSt('${w.id}',this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${w.st===k?"selected":""}>${v}</option>`).join("")}</select><button class="ib" onclick="speak(gid('${w.id}').w,'${w.l}')">🔊</button><button class="ib" onclick="edit('${w.id}')">✎</button><button class="ib" onclick="del('${w.id}')">🗑</button></div>
${w.ex?`<div class="x"><i>${esc(w.ex)}</i> — ${esc(w.xr)}</div>`:""}</div>`).join("")||`<div class="card mu" style="text-align:center">No words match.</div>`)+(a.length>150?`<p class="mu">Showing first 150 — refine your search.</p>`:"")}
function setSt(id,s){const w=gid(id);w.st=s;w.box=0;w.due=s==="learned"?Date.now()+DAY:0;if(s==="learned")w.learnedOn=day();save();toast("Status updated")}
function del(id){if(!confirm("Delete this word?"))return;S.words=S.words.filter(w=>w.id!==id);save();vlist();toast("Word deleted")}
function edit(id){const w=id?gid(id):{l:"e",st:"new",cat:""},m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target===m)m.remove()};
const f=(k,lb,t="input")=>`<label>${lb}</label><${t} id="f_${k}" ${t==="input"?`value="${esc(w[k])}"`:""}>${t==="textarea"?esc(w[k]):""}${t==="textarea"?"</textarea>":""}`;
m.innerHTML=`<div class="card"><h2>${id?"Edit word":"Add a word"}</h2><div class="fm"><label>Language</label><select id="f_l"><option value="e" ${w.l==="e"?"selected":""}>English</option><option value="t" ${w.l==="t"?"selected":""}>Turkish</option></select>
${f("w","Word")}${f("ru","Russian translation")}${f("ph","Pronunciation (optional)")}${f("ex","Example sentence")}${f("xr","Example in Russian")}
<label>Category</label><select id="f_cat"><option value="">None</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${w.cat===k?"selected":""}>${v}</option>`).join("")}</select>
<label>Status</label><select id="f_st">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${w.st===k?"selected":""}>${v}</option>`).join("")}</select></div>
<div class="row"><button class="btn l" id="sv">Save</button><button class="btn g" onclick="this.closest('.modal').remove()">Cancel</button></div></div>`;document.body.appendChild(m);
m.querySelector("#sv").onclick=()=>{const g=k=>m.querySelector("#f_"+k).value.trim(),o={l:g("l"),w:g("w"),ru:g("ru"),ph:g("ph"),ex:g("ex"),xr:g("xr"),cat:g("cat"),st:g("st")};
if(!o.w||!o.ru)return toast("Word and translation are required");
if(id){if(o.st!==w.st){w.box=0;w.due=0}Object.assign(w,o)}else S.words.push({id:"u"+Date.now(),box:0,due:0,...o});
save();m.remove();vlist();toast(id?"Word updated":"Word added")}}
function ring(p,c,sz,lb){const r=sz/2-8,C=2*Math.PI*r;return`<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="8"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" style="transition:stroke-dashoffset 1s"/></svg><b>${p}%</b>${lb?`<small>${lb}</small>`:""}</div>`}
function stats(){const a=S.words,T=a.length,k=a.filter(w=>w.st==="learned").length,lg=a.filter(w=>w.st==="learning").length,nw=T-k-lg,pc=T?Math.round(k/T*100):0;
const wk=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*DAY);return{d:d.toLocaleDateString("en",{weekday:"short"}),n:S.log[day(d)]||0}}),mx=Math.max(5,...wk.map(x=>x.n)),pe=l=>{const s=stat(l);return s.t?Math.round(s.k/s.t*100):0};
return`<h1>Your progress</h1><p class="mu">Every card counts.</p><div class="mini"><div class="card"><b>${nA(T)}</b><span>Total vocabulary</span></div><div class="card"><b>${nA(k)}</b><span>Words learned</span></div><div class="card"><b>${nA(lg)}</b><span>Practicing</span></div><div class="card"><b>${nA(nw)}</b><span>Remaining</span></div></div>
<div class="grid2"><div class="card"><h3>Learning</h3><div class="rings" style="margin:20px 0 28px">${ring(pc,"var(--lav)",120)}${ring(pe("e"),"var(--lav)",80,"English")}${ring(pe("t"),"#8fb093",80,"Turkish")}</div></div>
<div class="card"><h3>This week</h3><div class="wk" style="margin-top:20px">${wk.map(x=>`<div><i style="height:${x.n/mx*100}%"></i>${x.d}</div>`).join("")}</div></div></div>
<div class="card" style="margin-top:20px"><b>⭐ ${S.xp} XP</b> · 🔥 ${streak()}-day streak · ${wk.reduce((s,x)=>s+x.n,0)} cards this week</div>`}
function settings(){return`<h1>Settings</h1><div class="card" style="margin-top:24px"><div class="set"><div><b>Daily goal</b><div class="mu">Cards to study each day</div></div><div class="pills">${[5,10,15,20].map(n=>`<button class="pill ${S.goal===n?"on":""}" onclick="S.goal=${n};save();render(false)">${n}</button>`).join("")}</div></div>
<div class="set"><div><b>Pronunciation</b><div class="mu">Browser text-to-speech</div></div><button class="pill ${S.snd?"on":""}" onclick="S.snd=!S.snd;save();render(false)">${S.snd?"On":"Off"}</button></div>
<div class="set"><div><b>Reset progress</b><div class="mu">Restores the starter vocabulary and clears XP, streak and custom words</div></div><button class="btn g" onclick="if(confirm('Reset everything?')){S=init();save();ses=null;go('home');toast('Progress reset')}">Reset</button></div></div>`}
function render(a){document.getElementById("nav").innerHTML=`<div class="logo">Lingo <b>Cards</b></div>`+NAV.map(([k,n,i])=>`<button class="nb ${k===view?"on":""}" onclick="go('${k}')"><i>${i}</i>${n}</button>`).join("");
const v=document.getElementById("v");v.className="view"+(a?" in":"");
v.innerHTML={home,learn,vocab,review:()=>`<h1>Review</h1><p class="mu">Words due for repetition come first.</p><div style="height:22px"></div>`+langCards("review"),stats,settings}[view]();
if(view==="vocab")vlist();
v.querySelectorAll("[data-n]").forEach(el=>{const t=+el.dataset.n;if(!a||!t)return;const s=performance.now();(function f(n){const p=Math.min(1,(n-s)/800);el.textContent=Math.round(t*(1-Math.pow(1-p,3)))+el.dataset.s;if(p<1)requestAnimationFrame(f)})(s)});
if(a)window.scrollTo(0,0);if(view==="learn"&&ses&&!ses.q.length&&!ses.cf&&ses.n){ses.cf=1;confetti(80)}}
document.addEventListener("keydown",e=>{if(view!=="learn"||!ses||document.querySelector(".modal")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}else if(e.key==="ArrowRight"&&ses.fl)ans(true);else if(e.key==="ArrowLeft"&&ses.fl)ans(false)});
if(window.speechSynthesis)speechSynthesis.getVoices();render(true);
</script></body></html>
